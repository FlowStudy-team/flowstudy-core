spring.application.name=flowstudy-core

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/flowstudy?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:flowstudy}
spring.datasource.password=${DB_PASSWORD:flowstudy_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

logging.level.com.flowstudy.core.module.document=INFO

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:flowstudy}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:flowstudy_pass}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:500ms}

auth.jwt.private-key=${JWT_PRIVATE_KEY:}
auth.jwt.public-key=${JWT_PUBLIC_KEY:}
auth.jwt.access-expire-seconds=${JWT_ACCESS_EXPIRE_SECONDS:900}
auth.jwt.refresh-expire-seconds=${JWT_REFRESH_EXPIRE_SECONDS:2592000}
auth.jwt.allow-ephemeral=${JWT_ALLOW_EPHEMERAL:false}
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}

flowstudy.judge.rabbitmq.queue-name=${JUDGE_SUBMISSION_QUEUE:submission_queue}
flowstudy.judge.rabbitmq.dead-letter-exchange=${JUDGE_DEAD_LETTER_EXCHANGE:flowstudy.judge.dlx}
flowstudy.judge.rabbitmq.dead-letter-queue=${JUDGE_DEAD_LETTER_QUEUE:submission_queue.dlq}
flowstudy.judge.rabbitmq.dead-letter-routing-key=${JUDGE_DEAD_LETTER_ROUTING_KEY:judge.dead}

flowstudy.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
flowstudy.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}
flowstudy.rate-limit.login-per-window=${RATE_LIMIT_LOGIN_PER_WINDOW:10}
flowstudy.rate-limit.code-submit-per-window=${RATE_LIMIT_CODE_SUBMIT_PER_WINDOW:10}
flowstudy.rate-limit.code-run-per-window=${RATE_LIMIT_CODE_RUN_PER_WINDOW:20}
flowstudy.rate-limit.store-order-per-window=${RATE_LIMIT_STORE_ORDER_PER_WINDOW:5}

flowstudy.ai.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}
flowstudy.ai.internal-token=${AI_INTERNAL_TOKEN:}
flowstudy.ai.content-summary-enabled=${AI_CONTENT_SUMMARY_ENABLED:false}
flowstudy.search.enabled=${CONTENT_SEARCH_ENABLED:false}
flowstudy.search.base-url=${ELASTICSEARCH_URL:http://localhost:9200}
flowstudy.search.index=${ELASTICSEARCH_INDEX:flowstudy-content}
flowstudy.obs.enabled=${CONTENT_OBS_ENABLED:false}
flowstudy.obs.endpoint=${OBS_ENDPOINT:}
flowstudy.obs.access-key=${OBS_ACCESS_KEY:}
flowstudy.obs.secret-key=${OBS_SECRET_KEY:}
flowstudy.obs.bucket-name=${OBS_BUCKET_NAME:}
