spring.application.name=flowstudy-core

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/flowstudy?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:flowstudy}
spring.datasource.password=${DB_PASSWORD:flowstudy_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

logging.level.com.flowstudy.core.module.document=INFO

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:flowstudy}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:flowstudy_pass}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=${CONTENT_INDEX_RETRY_MAX_ATTEMPTS:3}
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.default-requeue-rejected=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:500ms}

auth.jwt.secret=${JWT_SECRET:flowstudy-local-development-secret-change-me-2026}
auth.jwt.expire-seconds=${JWT_EXPIRE_SECONDS:7200}

flowstudy.judge.rabbitmq.queue-name=${JUDGE_SUBMISSION_QUEUE:submission_queue}
flowstudy.judge.rabbitmq.dead-letter-exchange=${JUDGE_DEAD_LETTER_EXCHANGE:flowstudy.judge.dlx}
flowstudy.judge.rabbitmq.dead-letter-queue=${JUDGE_DEAD_LETTER_QUEUE:submission_queue.dlq}
flowstudy.judge.rabbitmq.dead-letter-routing-key=${JUDGE_DEAD_LETTER_ROUTING_KEY:judge.dead}

flowstudy.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
flowstudy.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}
flowstudy.rate-limit.login-per-window=${RATE_LIMIT_LOGIN_PER_WINDOW:10}
flowstudy.rate-limit.code-submit-per-window=${RATE_LIMIT_CODE_SUBMIT_PER_WINDOW:10}
flowstudy.rate-limit.code-run-per-window=${RATE_LIMIT_CODE_RUN_PER_WINDOW:20}
flowstudy.rate-limit.store-order-per-window=${RATE_LIMIT_STORE_ORDER_PER_WINDOW:5}

flowstudy.store.rabbitmq.exchange=${STORE_ORDER_EXCHANGE:flowstudy.store.order.exchange}
flowstudy.store.rabbitmq.routing-key=${STORE_ORDER_ROUTING_KEY:store.order.created}
flowstudy.store.rabbitmq.queue=${STORE_ORDER_QUEUE:flowstudy.store.order.queue}
flowstudy.store.rabbitmq.dead-letter-exchange=${STORE_ORDER_DLX:flowstudy.store.order.dlx}
flowstudy.store.rabbitmq.dead-letter-queue=${STORE_ORDER_DLQ:flowstudy.store.order.dlq}
flowstudy.store.rabbitmq.dead-letter-routing-key=${STORE_ORDER_DLQ_ROUTING_KEY:store.order.dead}
flowstudy.store.rabbitmq.consumer-concurrency=${STORE_ORDER_CONSUMER_CONCURRENCY:2}
flowstudy.store.rabbitmq.max-retries=${STORE_ORDER_MAX_RETRIES:3}

flowstudy.agent-runtime.base-url=${AGENT_RUNTIME_BASE_URL:http://localhost:8090}
flowstudy.agent-runtime.token=${AGENT_RUNTIME_TOKEN:}
flowstudy.agent-runtime.chat-timeout-seconds=${AGENT_RUNTIME_CHAT_TIMEOUT_SECONDS:120}

flowstudy.search.enabled=${SEARCH_ENABLED:true}
flowstudy.search.url=${ELASTICSEARCH_URL:http://localhost:9200}
flowstudy.search.username=${ELASTICSEARCH_USERNAME:}
flowstudy.search.password=${ELASTICSEARCH_PASSWORD:}
flowstudy.search.index=${ELASTICSEARCH_INDEX:flowstudy-content}

flowstudy.storage.provider=${OBJECT_STORAGE_PROVIDER:mock}
flowstudy.storage.local-dir=${OBJECT_STORAGE_LOCAL_DIR:${java.io.tmpdir}/flowstudy-objects}
flowstudy.storage.bucket=${OBS_BUCKET:}
flowstudy.storage.endpoint=${OBS_ENDPOINT:https://obs.cn-east-3.myhuaweicloud.com}
flowstudy.storage.region=${OBS_REGION:cn-east-3}
flowstudy.storage.access-key=${OBS_ACCESS_KEY:}
flowstudy.storage.secret-key=${OBS_SECRET_KEY:}

flowstudy.content-index.exchange=${CONTENT_INDEX_EXCHANGE:fs.content.exchange}
flowstudy.content-index.queue=${CONTENT_INDEX_QUEUE:fs.core.search-index.queue}
flowstudy.content-index.enabled=${CONTENT_INDEX_ENABLED:true}
