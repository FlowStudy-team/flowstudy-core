spring.datasource.url=jdbc:h2:mem:flowstudy;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
mybatis.configuration.map-underscore-to-camel-case=true
auth.jwt.private-key=
auth.jwt.public-key=
auth.jwt.access-expire-seconds=900
auth.jwt.refresh-expire-seconds=2592000
auth.jwt.allow-ephemeral=true
auth.cookie.secure=false
auth.cookie.same-site=Lax
flowstudy.judge.rabbitmq.queue-name=submission_queue
